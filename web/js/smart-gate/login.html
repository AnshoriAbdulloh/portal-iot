<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Smart Gate</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/login.css">
  <script src="js/auth.js"></script>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <div class="login-logo">
        <svg viewBox="0 0 32 32" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect x="2" y="4" width="28" height="24" rx="4" stroke="currentColor" stroke-width="2" fill="none"/>
          <path d="M16 4V28" stroke="currentColor" stroke-width="2"/>
          <path d="M8 12H12" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <path d="M20 12H24" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
          <circle cx="13" cy="16" r="1.5" fill="currentColor"/>
          <circle cx="19" cy="16" r="1.5" fill="currentColor"/>
        </svg>
        <span>SmartGate</span>
      </div>
      
      <form class="login-form" onsubmit="handleLogin(event)">
        <div class="form-group">
          <label class="form-label" for="username">Username</label>
          <input type="text" id="username" class="form-control" placeholder="Enter username" required autofocus>
        </div>
        <div class="form-group">
          <label class="form-label" for="password">Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>
        <button type="submit" class="btn btn-primary btn-login">Sign In</button>
        <div id="loginError" class="login-error"></div>
      </form>
      
      <div class="login-footer">
        Smart Gate Monitoring System v1.0
      </div>
    </div>
  </div>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <script src="js/firebase-config.js"></script>
</body>
</html>
