<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Residents — Smart Gate</title>
    <meta
      name="description"
      content="Manage residents for the Smart Housing Gate Monitoring System"
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/style.css" />
    <link rel="stylesheet" href="css/residents.css" />
  </head>
  <body>
    <div class="layout">
      <div class="sidebar-overlay" id="sidebarOverlay"></div>
      <aside class="sidebar" id="sidebar">
        <div class="sidebar-header">
          <div class="sidebar-logo">
            <svg
              viewBox="0 0 32 32"
              fill="none"
              xmlns="http://www.w3.org/2000/svg"
            >
              <rect
                x="2"
                y="4"
                width="28"
                height="24"
                rx="4"
                stroke="currentColor"
                stroke-width="2"
                fill="none"
              />
              <path d="M16 4V28" stroke="currentColor" stroke-width="2" />
              <path
                d="M8 12H12"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <path
                d="M20 12H24"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
              />
              <circle cx="13" cy="16" r="1.5" fill="currentColor" />
              <circle cx="19" cy="16" r="1.5" fill="currentColor" />
            </svg>
            <span>SmartGate</span>
          </div>
        </div>
        <nav class="sidebar-nav">
          <a href="index.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <rect x="3" y="3" width="7" height="7" />
              <rect x="14" y="3" width="7" height="7" />
              <rect x="3" y="14" width="7" height="7" />
              <rect x="14" y="14" width="7" height="7" />
            </svg>
            <span>Dashboard</span>
          </a>
          <a href="residents.html" class="nav-item active">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
              <circle cx="9" cy="7" r="4" />
              <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
              <path d="M16 3.13a4 4 0 0 1 0 7.75" />
            </svg>
            <span>Residents</span>
          </a>
          <a href="logs.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <path
                d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"
              />
              <polyline points="14 2 14 8 20 8" />
              <line x1="16" y1="13" x2="8" y2="13" />
              <line x1="16" y1="17" x2="8" y2="17" />
            </svg>
            <span>Access Logs</span>
          </a>
          <a href="settings.html" class="nav-item">
            <svg
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
            >
              <circle cx="12" cy="12" r="3" />
              <path
                d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06A1.65 1.65 0 0 0 4.68 15a1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06A1.65 1.65 0 0 0 9 4.68a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06A1.65 1.65 0 0 0 19.4 9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
              />
            </svg>
            <span>Settings</span>
          </a>
        </nav>
        <div class="sidebar-footer">Smart Gate v1.0 &copy; 2026</div>
      </aside>

      <main class="main-content">
        <header class="header">
          <button class="mobile-menu-btn" id="mobileMenuBtn">
            <svg
              width="24"
              height="24"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
            >
              <line x1="3" y1="6" x2="21" y2="6" />
              <line x1="3" y1="12" x2="21" y2="12" />
              <line x1="3" y1="18" x2="21" y2="18" />
            </svg>
          </button>
          <h1 class="page-title">Residents</h1>
          <div class="header-right">
            <!-- <span class="header-time" id="currentTime"></span> -->
            <div class="header-user">
              <div class="avatar">A</div>
              <span>Admin</span>
            </div>
          </div>
        </header>

        <div class="content">
          <div class="page-toolbar">
            <div class="search-box">
              <svg
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <circle cx="11" cy="11" r="8" />
                <line x1="21" y1="21" x2="16.65" y2="16.65" />
              </svg>
              <input
                type="text"
                class="form-control"
                id="searchResident"
                placeholder="Search by name, house, or UID..."
              />
            </div>
            <button class="btn btn-primary" onclick="openAddModal()">
              <svg
                width="18"
                height="18"
                viewBox="0 0 24 24"
                fill="none"
                stroke="currentColor"
                stroke-width="2"
                stroke-linecap="round"
                stroke-linejoin="round"
              >
                <line x1="12" y1="5" x2="12" y2="19" />
                <line x1="5" y1="12" x2="19" y2="12" />
              </svg>
              Add Resident
            </button>
          </div>

          <div class="card">
            <div class="table-responsive">
              <table class="data-table">
                <thead>
                  <tr>
                    <th>Name</th>
                    <th>House No.</th>
                    <th>RFID UID</th>
                    <th>Status</th>
                    <th>Actions</th>
                  </tr>
                </thead>
                <tbody id="residentsTableBody">
                  <!-- Data will be populated here -->
                  <tr>
                    <td colspan="5">
                      <div class="empty-state">
                        <svg
                          viewBox="0 0 24 24"
                          fill="none"
                          stroke="currentColor"
                          stroke-width="1.5"
                        >
                          <circle cx="12" cy="12" r="10" />
                          <line x1="12" y1="8" x2="12" y2="12" />
                          <line x1="12" y1="16" x2="12.01" y2="16" />
                        </svg>
                        <h3>Loading residents...</h3>
                      </div>
                    </td>
                  </tr>
                </tbody>
              </table>
            </div>
            <div class="table-footer flex-between">
              <span id="residentCount">Total: 0 residents</span>
            </div>
          </div>
        </div>
      </main>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal-overlay" id="residentModal">
      <div class="modal">
        <div class="modal-header">
          <h3 id="modalTitle">Add New Resident</h3>
          <button
            class="modal-close"
            onclick="toggleModal('residentModal', false)"
          >
            &times;
          </button>
        </div>
        <div class="modal-body">
          <form id="residentForm">
            <div class="form-group">
              <label class="form-label">RFID UID</label>
              <input
                style="pointer-events: none"
                type="text"
                id="residentUid"
                class="form-control"
                required
                placeholder="Tap Kartu"
              />
            </div>
            <div class="form-group">
              <label class="form-label">Name</label>
              <input
                type="text"
                id="residentName"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">House Number</label>
              <input
                type="text"
                id="residentHouse"
                class="form-control"
                required
              />
            </div>
            <div class="form-group">
              <label class="form-label">Status</label>
              <select id="residentStatus" class="form-control">
                <option value="true">Active</option>
                <option value="false">Inactive</option>
              </select>
            </div>
          </form>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-outline"
            onclick="toggleModal('residentModal', false)"
          >
            Cancel
          </button>
          <button class="btn btn-primary" onclick="saveResident()">
            Save Resident
          </button>
        </div>
      </div>
    </div>

    <!-- Delete Modal -->
    <div class="modal-overlay" id="deleteModal">
      <div class="modal">
        <div class="modal-header">
          <h3>Confirm Delete</h3>
          <button
            class="modal-close"
            onclick="toggleModal('deleteModal', false)"
          >
            &times;
          </button>
        </div>
        <div class="modal-body">
          <p>
            Are you sure you want to delete <strong id="deleteName"></strong>?
            This action cannot be undone.
          </p>
        </div>
        <div class="modal-footer">
          <button
            class="btn btn-outline"
            onclick="toggleModal('deleteModal', false)"
          >
            Cancel
          </button>
          <button class="btn btn-danger" id="confirmDeleteBtn">Delete</button>
        </div>
      </div>
    </div>

    <div class="toast-container" id="toastContainer"></div>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
    <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
    <script src="js/firebase-config.js"></script>
    <script src="js/utils.js"></script>
    <script src="js/residents.js"></script>
  </body>
</html>
